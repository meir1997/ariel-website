<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לימוד אלף בית</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="%23FFD700" stroke="%23000" stroke-width="3"/><circle cx="32" cy="32" r="24" fill="%23FFED4E"/></svg>') 32 32, auto;
        }

        html {
            direction: rtl;
        }

        @keyframes bounce-scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes slide-in {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .bounce-scale {
            animation: bounce-scale 0.6s ease-in-out;
        }

        .slide-in {
            animation: slide-in 0.5s ease-out;
        }

        .pulse-anim {
            animation: pulse 1s ease-in-out infinite;
        }

        button {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        canvas {
            touch-action: none;
            -webkit-touch-callout: none;
        }

        .kids-pink { background-color: #FF6B9D; }
        .kids-blue { background-color: #4A90E2; }
        .kids-yellow { background-color: #FFD93D; }
        .kids-green { background-color: #6BCB77; }
        .kids-purple { background-color: #9D84B7; }
        .kids-orange { background-color: #FF8C42; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        class AlephBetApp {
            constructor() {
                this.LETTERS = [
                    { letter: 'א', name: 'אלף', sound: 'a', color: 'kids-pink' },
                    { letter: 'ב', name: 'בית', sound: 'b', color: 'kids-blue' },
                    { letter: 'ג', name: 'גימל', sound: 'g', color: 'kids-yellow' },
                    { letter: 'ד', name: 'דלת', sound: 'd', color: 'kids-green' },
                    { letter: 'ה', name: 'הה', sound: 'h', color: 'kids-purple' },
                    { letter: 'ו', name: 'ו', sound: 'v', color: 'kids-orange' },
                    { letter: 'ז', name: 'זיין', sound: 'z', color: 'kids-pink' },
                    { letter: 'ח', name: 'חית', sound: 'ch', color: 'kids-blue' },
                    { letter: 'ט', name: 'טית', sound: 't', color: 'kids-yellow' },
                    { letter: 'י', name: 'יוד', sound: 'y', color: 'kids-green' },
                    { letter: 'כ', name: 'כף', sound: 'k', color: 'kids-purple' },
                    { letter: 'ל', name: 'למד', sound: 'l', color: 'kids-orange' },
                    { letter: 'מ', name: 'מם', sound: 'm', color: 'kids-pink' },
                    { letter: 'נ', name: 'נון', sound: 'n', color: 'kids-blue' },
                    { letter: 'ס', name: 'סמך', sound: 's', color: 'kids-yellow' },
                    { letter: 'ע', name: 'עין', sound: 'ah', color: 'kids-green' },
                    { letter: 'פ', name: 'פה', sound: 'p', color: 'kids-purple' },
                    { letter: 'צ', name: 'צדי', sound: 'tz', color: 'kids-orange' },
                    { letter: 'ק', name: 'קוף', sound: 'k', color: 'kids-pink' },
                    { letter: 'ר', name: 'ריש', sound: 'r', color: 'kids-blue' },
                    { letter: 'ש', name: 'שין', sound: 'sh', color: 'kids-yellow' },
                    { letter: 'ת', name: 'תיו', sound: 't', color: 'kids-green' },
                ];

                this.NIKUD_MARKS = [
                    { name: 'קמץ', mark: '\u05B8' },
                    { name: 'פתח', mark: '\u05B7' },
                    { name: 'צירי', mark: '\u05B5' },
                    { name: 'סגול', mark: '\u05B6' },
                    { name: 'חיריק', mark: '\u05B4' },
                    { name: 'חולם', mark: '\u05B9' },
                    { name: 'קובוץ', mark: '\u05BB' },
                    { name: 'שווא', mark: '\u05B0' },
                ];

                this.MATCH_ITEMS = [
                    { word: 'אריה', letter: 'א', image: 'lion' },
                    { word: 'ברווז', letter: 'ב', image: 'duck' },
                    { word: 'גמל', letter: 'ג', image: 'camel' },
                    { word: 'דב', letter: 'ד', image: 'bear' },
                    { word: 'היפופוטם', letter: 'ה', image: 'hippo' },
                    { word: 'וילון', letter: 'ו', image: 'curtain' },
                    { word: 'זברה', letter: 'ז', image: 'zebra' },
                    { word: 'חתול', letter: 'ח', image: 'cat' },
                    { word: 'טיגריס', letter: 'ט', image: 'tiger' },
                    { word: 'ינשוף', letter: 'י', image: 'owl' },
                    { word: 'כלב', letter: 'כ', image: 'dog' },
                    { word: 'לווייתן', letter: 'ל', image: 'whale' },
                    { word: 'מקק', letter: 'מ', image: 'cockroach' },
                    { word: 'נמר', letter: 'נ', image: 'leopard' },
                    { word: 'סוס', letter: 'ס', image: 'horse' },
                    { word: 'עטלף', letter: 'ע', image: 'bat' },
                    { word: 'פיל', letter: 'פ', image: 'elephant' },
                    { word: 'צבי', letter: 'צ', image: 'gazelle' },
                    { word: 'קוף', letter: 'ק', image: 'monkey' },
                    { word: 'ראם', letter: 'ר', image: 'oryx' },
                    { word: 'שועל', letter: 'ש', image: 'fox' },
                    { word: 'תנין', letter: 'ת', image: 'crocodile' },
                ];

                this.mode = new URLSearchParams(window.location.search).has('nikud') ? 'nikudSettings' : 'menu';
                this.currentLetterIndex = 0;
                this.gameState = { matches: 0, total: 0, answers: [] };
                this.message = '';
                this.isDrawing = false;
                this.canvas = null;
                this.ctx = null;
                this.currentGameLetters = [];
                this.selectedNikudIndex = 0;
                this.nikudRangeEnd = this.LETTERS.length - 1;
                this.currentNikudLetterIndex = 0;

                // Score tracking
                this.loadScores();

                this.render();
            }

            loadScores() {
                const today = new Date().toISOString().split('T')[0];
                const savedScores = localStorage.getItem('alphaScores');

                if (savedScores) {
                    this.scores = JSON.parse(savedScores);
                    // Reset daily score if it's a new day
                    if (this.scores.lastDate !== today) {
                        this.scores.daily = 0;
                        this.scores.lastDate = today;
                    }
                } else {
                    this.scores = { daily: 0, total: 0, lastDate: today };
                }
            }

            saveScores() {
                localStorage.setItem('alphaScores', JSON.stringify(this.scores));
            }

            addScore(points) {
                this.scores.daily += points;
                this.scores.total += points;
                this.saveScores();
            }

            playSound(sound) {
                const utterance = new SpeechSynthesisUtterance(sound);
                utterance.lang = 'he-IL';
                utterance.rate = 0.8;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            }

            startLearning() {
                this.mode = 'learn';
                this.currentLetterIndex = 0;
                this.render();
            }

            openNikudSettings() {
                this.mode = 'nikudSettings';
                this.render();
            }

            selectNikud(index) {
                this.selectedNikudIndex = index;
                this.render();
            }

            setNikudRange(value) {
                this.nikudRangeEnd = value === 'all' ? this.LETTERS.length - 1 : Number(value);
            }

            startNikud() {
                this.currentNikudLetterIndex = 0;
                this.mode = 'nikudLearn';
                this.render();
            }

            moveNikudLetter(step) {
                const nextIndex = this.currentNikudLetterIndex + step;
                if (nextIndex < 0) return;
                if (nextIndex > this.nikudRangeEnd) {
                    this.mode = 'nikudComplete';
                } else {
                    this.currentNikudLetterIndex = nextIndex;
                }
                this.render();
            }

            startMatchGame() {
                this.mode = 'match';
                this.matchRunId = (this.matchRunId || 0) + 1;
                this.currentGameSequence = this.shuffle([...this.MATCH_ITEMS]);
                this.currentGameIndex = 0;
                this.gameState = { matches: 0, total: this.currentGameSequence.length, answers: [] };
                this.messageEmoji = '';
                this.earnedPoints = 0;
                this.matchLocked = false;
                this.prepareMatchOptions();
                this.render();
            }

            shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            prepareMatchOptions() {
                const correct = this.currentGameSequence[this.currentGameIndex].letter;
                const others = this.shuffle(this.MATCH_ITEMS.map(item => item.letter).filter(letter => letter !== correct)).slice(0, 5);
                this.currentMatchOptions = this.shuffle([correct, ...others]);
            }

            startSortGame() {
                this.mode = 'sort';

                // Use the whole alphabet from א to ת
                const run = [...this.LETTERS];

                // The correct order (by alphabet)
                this.sortCorrect = run.map(l => l.letter);

                // Shuffle the tiles, making sure they aren't already in order
                let shuffled;
                do {
                    shuffled = [...run].sort(() => Math.random() - 0.5);
                } while (shuffled.map(l => l.letter).join('') === this.sortCorrect.join(''));

                this.sortTiles = shuffled;            // remaining tiles to pick from
                this.sortPlaced = [];                 // letters placed in order so far
                this.sortNextIndex = 0;               // index of the next correct letter
                this.sortEarnedPoints = 0;
                this.messageEmoji = '';
                this.render();
            }

            handleSort(letter) {
                const expected = this.sortCorrect[this.sortNextIndex];

                if (letter === expected) {
                    // Correct! Move tile to the placed row
                    this.sortPlaced.push(letter);
                    this.sortTiles = this.sortTiles.filter(t => t.letter !== letter);
                    this.sortNextIndex++;
                    this.sortEarnedPoints += 10;
                    this.playSound(letter);

                    if (this.sortNextIndex >= this.sortCorrect.length) {
                        // Whole sequence done
                        this.messageEmoji = '🎉';
                        this.render();
                        setTimeout(() => {
                            this.addScore(this.sortEarnedPoints);
                            this.earnedPoints = this.sortEarnedPoints;
                            this.mode = 'sortComplete';
                            this.render();
                        }, 1000);
                    } else {
                        this.messageEmoji = '✨';
                        this.render();
                        setTimeout(() => {
                            this.messageEmoji = '';
                            this.render();
                        }, 700);
                    }
                } else {
                    // Wrong letter
                    this.messageEmoji = '🔄';
                    this.render();
                    setTimeout(() => {
                        this.messageEmoji = '';
                        this.render();
                    }, 800);
                }
            }

            renderSort() {
                // Tiles still to be picked
                const tiles = this.sortTiles.map((letterData) => {
                    return `
                        <button onclick="app.handleSort('${letterData.letter}')" style="background: ${this.getColorBgLight(letterData.color)}; border: 3px solid ${this.getColorBg(letterData.color)};" class="text-3xl sm:text-4xl font-bold w-12 h-12 sm:w-14 sm:h-14 rounded-xl hover:scale-110 transition-transform duration-200 transform hover:shadow-lg flex items-center justify-center">${letterData.letter}</button>
                    `;
                }).join('');

                // Slots showing the ordered row (placed + empty placeholders)
                const slots = this.sortCorrect.map((letter, i) => {
                    if (i < this.sortPlaced.length) {
                        const letterData = this.LETTERS.find(l => l.letter === this.sortPlaced[i]);
                        return `<div style="background: ${this.getColorBg(letterData.color)};" class="text-2xl sm:text-3xl font-bold text-white w-10 h-10 sm:w-12 sm:h-12 rounded-xl flex items-center justify-center bounce-scale">${letter}</div>`;
                    }
                    const isNext = i === this.sortPlaced.length;
                    return `<div class="text-xl text-gray-300 w-10 h-10 sm:w-12 sm:h-12 rounded-xl flex items-center justify-center border-2 border-dashed ${isNext ? 'border-green-500 pulse-anim' : 'border-gray-300'}">?</div>`;
                }).join('');

                return `
                    <div class="min-h-screen bg-gradient-to-br from-green-300 via-teal-300 to-blue-300 flex items-center justify-center p-4">
                        <div class="w-full max-w-md">
                            <div class="text-center mb-6">
                                <button onclick="app.goToMenu()" class="text-4xl bg-white rounded-full w-14 h-14 flex items-center justify-center hover:bg-gray-200 transition mb-4">✕</button>
                            </div>

                            <div class="bg-white rounded-2xl p-5 shadow-xl">
                                <p class="text-center text-2xl font-bold text-gray-800 mb-1">סדר את כל האותיות 🔢</p>
                                <p class="text-center text-base text-gray-600 mb-2">לחץ על האות הבאה בסדר האלף-בית (א׳ עד ת׳)</p>
                                <p class="text-center text-sm text-gray-500 mb-4">${this.sortPlaced.length} / ${this.sortCorrect.length}</p>

                                <div class="flex flex-wrap justify-center gap-1.5 mb-6 bg-gray-50 rounded-xl p-2" dir="rtl">
                                    ${slots}
                                </div>

                                <div class="flex flex-wrap justify-center gap-2 mb-2" dir="rtl">
                                    ${tiles}
                                </div>

                                ${this.messageEmoji ? `<p class="text-center text-5xl mt-6 font-bold bounce-scale">${this.messageEmoji}</p>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }

            renderSortComplete() {
                return `
                    <div class="min-h-screen bg-gradient-to-br from-teal-400 via-green-400 to-yellow-400 flex items-center justify-center p-4">
                        <div class="w-full max-w-md">
                            <div class="bg-white rounded-3xl p-8 shadow-2xl text-center slide-in">
                                <p class="text-9xl mb-4 animate-bounce">🎉</p>
                                <h1 class="text-4xl font-bold text-gray-800 mb-2">כל הכבוד!</h1>
                                <p class="text-2xl text-gray-700 mb-6">סידרת את האותיות בהצלחה!</p>

                                <div class="bg-gradient-to-r from-green-300 to-teal-300 rounded-2xl p-6 mb-6">
                                    <p class="text-lg text-gray-700 mb-2">נקודות שהרווחת:</p>
                                    <p class="text-6xl font-bold text-white">${this.earnedPoints}</p>
                                </div>

                                <div class="bg-blue-100 rounded-2xl p-4 mb-6">
                                    <p class="text-gray-700 text-lg">📊 ניקוד כולל:</p>
                                    <p class="text-4xl font-bold text-blue-600">🏆 ${this.scores.total}</p>
                                </div>

                                <div class="flex gap-3">
                                    <button onclick="app.startSortGame()" class="flex-1 bg-green-500 text-white text-xl font-bold py-4 rounded-2xl hover:scale-105 transition-transform duration-200">🔄 עוד פעם</button>
                                    <button onclick="app.goToMenu()" class="flex-1 bg-blue-500 text-white text-xl font-bold py-4 rounded-2xl hover:scale-105 transition-transform duration-200">🏠 לבית</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            openMemoryLevels() {
                this.mode = 'memoryLevels';
                this.render();
            }

            renderMemoryLevels() {
                return `
                    <div class="min-h-screen bg-gradient-to-br from-indigo-300 via-purple-300 to-pink-300 flex items-center justify-center p-4">
                        <div class="w-full max-w-md">
                            <div class="text-center mb-4">
                                <button onclick="app.goToMenu()" class="text-4xl bg-white rounded-full w-14 h-14 flex items-center justify-center hover:bg-gray-200 transition">✕</button>
                            </div>

                            <div class="bg-white rounded-3xl p-6 shadow-xl">
                                <p class="text-center text-3xl font-bold text-gray-800 mb-2">🧠 משחק זיכרון</p>
                                <p class="text-center text-lg text-gray-600 mb-6">בחר רמת קושי:</p>

                                <div class="space-y-4">
                                    <button onclick="app.startMemoryGame(6)" class="w-full bg-green-500 text-white text-2xl font-bold py-5 rounded-2xl hover:scale-105 transition-transform">😀 קל<span class="block text-base font-normal">6 זוגות</span></button>
                                    <button onclick="app.startMemoryGame(12)" class="w-full bg-orange-500 text-white text-2xl font-bold py-5 rounded-2xl hover:scale-105 transition-transform">🙂 בינוני<span class="block text-base font-normal">12 זוגות</span></button>
                                    <button onclick="app.startMemoryGame(18)" class="w-full bg-red-500 text-white text-2xl font-bold py-5 rounded-2xl hover:scale-105 transition-transform">😎 קשה<span class="block text-base font-normal">18 זוגות</span></button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            startMemoryGame(pairsCount) {
                this.mode = 'memory';

                // Number of pairs (default to easy if not provided)
                pairsCount = pairsCount || 6;
                this.memoryPairs = pairsCount;
                const chosen = [...this.LETTERS].sort(() => Math.random() - 0.5).slice(0, pairsCount);

                let cards = [];
                chosen.forEach((letterData) => {
                    cards.push({ letter: letterData.letter, color: letterData.color, flipped: false, matched: false });
                    cards.push({ letter: letterData.letter, color: letterData.color, flipped: false, matched: false });
                });
                cards = cards.sort(() => Math.random() - 0.5);

                this.memoryCards = cards;
                this.memoryFirstIndex = null;
                this.memoryLock = false;
                this.memoryMoves = 0;
                this.memoryMatched = 0;
                this.memoryEarnedPoints = 0;
                this.render();
            }

            handleMemoryFlip(index) {
                if (this.memoryLock) return;
                const card = this.memoryCards[index];
                if (card.flipped || card.matched) return;

                card.flipped = true;

                if (this.memoryFirstIndex === null) {
                    // First card of the pair
                    this.memoryFirstIndex = index;
                    this.playSound(card.letter);
                    this.render();
                    return;
                }

                // Second card of the pair
                this.memoryMoves++;
                const first = this.memoryCards[this.memoryFirstIndex];
                this.playSound(card.letter);
                this.render();

                if (first.letter === card.letter) {
                    // Match!
                    this.memoryLock = true;
                    setTimeout(() => {
                        first.matched = true;
                        card.matched = true;
                        this.memoryFirstIndex = null;
                        this.memoryLock = false;
                        this.memoryMatched++;
                        this.memoryEarnedPoints += 10;

                        if (this.memoryMatched >= this.memoryCards.length / 2) {
                            this.addScore(this.memoryEarnedPoints);
                            this.earnedPoints = this.memoryEarnedPoints;
                            this.mode = 'memoryComplete';
                        }
                        this.render();
                    }, 600);
                } else {
                    // No match - flip both back after a short delay
                    this.memoryLock = true;
                    setTimeout(() => {
                        first.flipped = false;
                        card.flipped = false;
                        this.memoryFirstIndex = null;
                        this.memoryLock = false;
                        this.render();
                    }, 1000);
                }
            }

            renderMemory() {
                // Layout adapts to the number of pairs so all cards fit nicely
                let cols, faceText, backText, gap, radius;
                if (this.memoryPairs <= 6) {
                    cols = 'grid-cols-4'; faceText = 'text-4xl sm:text-5xl'; backText = 'text-3xl sm:text-4xl'; gap = 'gap-2 sm:gap-3'; radius = 'rounded-2xl';
                } else if (this.memoryPairs <= 12) {
                    cols = 'grid-cols-6'; faceText = 'text-2xl sm:text-3xl'; backText = 'text-xl sm:text-2xl'; gap = 'gap-1.5 sm:gap-2'; radius = 'rounded-xl';
                } else {
                    cols = 'grid-cols-6'; faceText = 'text-xl sm:text-2xl'; backText = 'text-base sm:text-xl'; gap = 'gap-1 sm:gap-1.5'; radius = 'rounded-lg';
                }

                const cards = this.memoryCards.map((card, i) => {
                    if (card.flipped || card.matched) {
                        const opacity = card.matched ? 'opacity-60' : '';
                        return `
                            <button onclick="app.handleMemoryFlip(${i})" style="background: ${this.getColorBg(card.color)};" class="aspect-square ${radius} ${faceText} font-bold text-white flex items-center justify-center shadow-md bounce-scale ${opacity}">${card.letter}</button>
                        `;
                    }
                    return `
                        <button onclick="app.handleMemoryFlip(${i})" class="aspect-square ${radius} ${backText} font-bold text-white flex items-center justify-center shadow-md bg-gradient-to-br from-indigo-400 to-purple-500 hover:scale-105 transition-transform">❓</button>
                    `;
                }).join('');

                return `
                    <div class="min-h-screen bg-gradient-to-br from-indigo-300 via-purple-300 to-pink-300 flex items-center justify-center p-4">
                        <div class="w-full max-w-md">
                            <div class="text-center mb-4">
                                <button onclick="app.goToMenu()" class="text-4xl bg-white rounded-full w-14 h-14 flex items-center justify-center hover:bg-gray-200 transition">✕</button>
                            </div>

                            <div class="bg-white rounded-2xl p-5 shadow-xl">
                                <p class="text-center text-2xl font-bold text-gray-800 mb-1">🧠 משחק זיכרון</p>
                                <p class="text-center text-base text-gray-600 mb-1">מצא את זוגות האותיות!</p>
                                <p class="text-center text-sm text-gray-500 mb-4">זוגות: ${this.memoryMatched} / ${this.memoryCards.length / 2} | מהלכים: ${this.memoryMoves}</p>

                                <div class="grid ${cols} ${gap}">
                                    ${cards}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderMemoryComplete() {
                return `
                    <div class="min-h-screen bg-gradient-to-br from-purple-400 via-indigo-400 to-pink-400 flex items-center justify-center p-4">
                        <div class="w-full max-w-md">
                            <div class="bg-white rounded-3xl p-8 shadow-2xl text-center slide-in">
                                <p class="text-9xl mb-4 animate-bounce">🎉</p>
                                <h1 class="text-4xl font-bold text-gray-800 mb-2">כל הכבוד!</h1>
                                <p class="text-2xl text-gray-700 mb-6">מצאת את כל הזוגות!</p>

                                <div class="bg-gradient-to-r from-indigo-300 to-purple-300 rounded-2xl p-6 mb-6">
                                    <p class="text-lg text-gray-700 mb-2">נקודות שהרווחת:</p>
                                    <p class="text-6xl font-bold text-white">${this.earnedPoints}</p>
                                    <p class="text-sm text-gray-700 mt-2">🧠 ב-${this.memoryMoves} מהלכים</p>
                                </div>

                                <div class="bg-blue-100 rounded-2xl p-4 mb-6">
                                    <p class="text-gray-700 text-lg">📊 ניקוד כולל:</p>
                                    <p class="text-4xl font-bold text-blue-600">🏆 ${this.scores.total}</p>
                                </div>

                                <div class="flex gap-3 mb-3">
                                    <button onclick="app.startMemoryGame(${this.memoryPairs})" class="flex-1 bg-purple-500 text-white text-xl font-bold py-4 rounded-2xl hover:scale-105 transition-transform duration-200">🔄 עוד פעם</button>
                                    <button onclick="app.openMemoryLevels()" class="flex-1 bg-indigo-400 text-white text-xl font-bold py-4 rounded-2xl hover:scale-105 transition-transform duration-200">🎚️ רמה אחרת</button>
                                </div>
                                <button onclick="app.goToMenu()" class="w-full bg-blue-500 text-white text-xl font-bold py-4 rounded-2xl hover:scale-105 transition-transform duration-200">🏠 לבית</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            startDrawing() {
                this.mode = 'draw';
                this.currentLetterIndex = 0;
                this.render();
                setTimeout(() => this.clearCanvas(), 100);
            }

            nextLetter() {
                if (this.currentLetterIndex < this.LETTERS.length - 1) {
                    this.currentLetterIndex++;
                    this.render();
                } else {
                    this.message = 'כל הכבוד! למדת את כל האותיות! 🎉';
                    this.render();
                    setTimeout(() => {
                        this.mode = 'menu';
                        this.render();
                    }, 2000);
                }
            }

            previousLetter() {
                if (this.currentLetterIndex > 0) {
                    this.currentLetterIndex--;
                    this.render();
                }
            }

            clearCanvas() {
                if (this.canvas) {
                    const ctx = this.canvas.getContext('2d');
                    if (ctx) {
                        ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                    }
                }
            }

            renderMenu() {
                return `
                    <div class="min-h-screen bg-gradient-to-br from-blue-400 via-purple-400 to-pink-400 flex items-center justify-center p-4">
                        <div class="w-full max-w-md">
                            <div class="text-center mb-8 slide-in">
                                <h1 class="text-5xl font-bold text-white mb-2">🎉 אלף בית</h1>
                                <p class="text-2xl text-white">לימוד אותיות בכיף!</p>

                                <div class="mt-4 bg-white bg-opacity-30 p-3 rounded-2xl">
                                    <p class="text-white text-lg">🌟 היום: <span class="font-bold text-yellow-200">${this.scores.daily}</span> | 🏆 כללי: <span class="font-bold text-yellow-200">${this.scores.total}</span></p>
                                </div>
                            </div>

                            <div class="space-y-4">
                                <button onclick="app.startLearning()" class="w-full bg-red-400 text-white text-2xl font-bold py-6 px-8 rounded-3xl hover:shadow-lg transform hover:scale-105 transition-all duration-200">📚 למד אותיות</button>
                                <button onclick="app.openNikudSettings()" class="w-full bg-orange-500 text-white text-2xl font-bold py-6 px-8 rounded-3xl hover:shadow-lg transform hover:scale-105 transition-all duration-200">🔤 למד ניקוד</button>
                                <button onclick="app.startMatchGame()" class="w-full bg-blue-500 text-white text-2xl font-bold py-6 px-8 rounded-3xl hover:shadow-lg transform hover:scale-105 transition-all duration-200">🎮 משחק התאמה: אות פותחת</button>
                                <button onclick="app.startSortGame()" class="w-full bg-green-500 text-white text-2xl font-bold py-6 px-8 rounded-3xl hover:shadow-lg transform hover:scale-105 transition-all duration-200">🔢 סדר את האותיות</button>
                                <button onclick="app.openMemoryLevels()" class="w-full bg-purple-500 text-white text-2xl font-bold py-6 px-8 rounded-3xl hover:shadow-lg transform hover:scale-105 transition-all duration-200">🧠 משחק זיכרון</button>
                                <button onclick="app.startDrawing()" class="w-full bg-yellow-500 text-white text-2xl font-bold py-6 px-8 rounded-3xl hover:shadow-lg transform hover:scale-105 transition-all duration-200">✏️ צייר ותרגל</button>
                            </div>

                            <div class="mt-8 bg-white bg-opacity-20 p-4 rounded-2xl">
                                <p class="text-white text-lg">👋 שלום! בואו נלמד אותיות עברית ביחד!</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderLearn() {
                const letter = this.LETTERS[this.currentLetterIndex];
                const colorClass = letter.color;

                return `
                    <div class="min-h-screen bg-gradient-to-br from-green-300 via-blue-300 to-purple-300 flex items-center justify-center p-4">
                        <div class="w-full max-w-md">
                            <div class="mb-4 text-center">
                                <button onclick="app.goToMenu()" class="text-3xl bg-white rounded-full w-12 h-12 flex items-center justify-center hover:bg-gray-200 transition">✕</button>
                            </div>

                            <div class="rounded-3xl p-8 shadow-2xl mb-6 slide-in" style="background: ${this.getColorBg(colorClass)};">
                                <div class="text-center">
                                    <div class="text-9xl font-bold text-white mb-4">${letter.letter}</div>
                                    <p class="text-3xl text-white font-bold mb-2">${letter.name}</p>

                                    <div class="flex gap-3 justify-center mt-6">
                                        <button onclick="app.playSound('${letter.name}')" class="bg-white text-3xl rounded-full w-16 h-16 flex items-center justify-center hover:scale-110 transition-transform">🔤</button>
                                        <button onclick="app.playSound('${letter.sound}')" class="bg-white text-3xl rounded-full w-16 h-16 flex items-center justify-center hover:scale-110 transition-transform">🔊</button>
                                    </div>
                                </div>
                            </div>

                            <p class="text-center text-white text-lg mb-4">אות ${this.currentLetterIndex + 1} מתוך ${this.LETTERS.length}</p>

                            <div class="flex gap-3">
                                <button onclick="app.previousLetter()" ${this.currentLetterIndex === 0 ? 'disabled' : ''} class="flex-1 bg-white text-2xl font-bold py-4 px-6 rounded-2xl disabled:opacity-50 disabled:cursor-not-allowed hover:scale-105 transition">←</button>
                                <button onclick="app.nextLetter()" class="flex-1 bg-white text-2xl font-bold py-4 px-6 rounded-2xl hover:scale-105 transition">→</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderNikudSettings() {
                const markButtons = this.NIKUD_MARKS.map((nikud, index) => `
                    <button type="button" role="radio" aria-checked="${this.selectedNikudIndex === index}" onclick="app.selectNikud(${index})"
                        class="rounded-2xl border-4 p-3 text-center font-bold transition ${this.selectedNikudIndex === index ? 'border-orange-500 bg-orange-100' : 'border-gray-200 bg-white hover:border-orange-300'}">
                        <span class="block text-5xl leading-tight" aria-hidden="true">ב${nikud.mark}</span>
                        <span class="block text-lg">${nikud.name}</span>
                    </button>
                `).join('');
                const rangeOptions = this.LETTERS.map((letter, index) => `
                    <option value="${index}" ${this.nikudRangeEnd === index && index !== this.LETTERS.length - 1 ? 'selected' : ''}>עד ${letter.letter} (${letter.name})</option>
                `).join('');

                return `
                    <main class="min-h-screen bg-gradient-to-br from-orange-300 via-pink-300 to-purple-300 flex items-center justify-center p-4">
                        <div class="w-full max-w-lg bg-white rounded-3xl p-6 shadow-2xl">
                            <button onclick="app.goToMenu()" class="text-lg font-bold text-blue-700 mb-4">→ חזרה למשחקים</button>
                            <h1 class="text-3xl font-bold text-gray-800 text-center mb-2">🔤 לומדים ניקוד</h1>
                            <p class="text-center text-gray-700 text-lg mb-5">בוחרים סימן ניקוד ומתרגלים אותו עם האותיות.</p>
                            <h2 class="text-xl font-bold text-gray-800 mb-3">איזה ניקוד נלמד?</h2>
                            <div role="radiogroup" aria-label="סימן הניקוד" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">${markButtons}</div>
                            <label for="nikudRange" class="block text-xl font-bold text-gray-800 mb-2">אילו אותיות נתרגל?</label>
                            <select id="nikudRange" onchange="app.setNikudRange(this.value)" class="w-full rounded-2xl border-2 border-gray-400 bg-white p-4 text-xl mb-6">
                                <option value="all" ${this.nikudRangeEnd === this.LETTERS.length - 1 ? 'selected' : ''}>כל האותיות (א–ת)</option>
                                ${rangeOptions}
                            </select>
                            <button onclick="app.startNikud()" class="w-full bg-orange-500 text-white text-2xl font-bold py-4 rounded-2xl hover:bg-orange-600">מתחילים ללמוד ▶</button>
                        </div>
                    </main>
                `;
            }

            renderNikudLearn() {
                const letter = this.LETTERS[this.currentNikudLetterIndex];
                const nikud = this.NIKUD_MARKS[this.selectedNikudIndex];
                return `
                    <main class="min-h-screen bg-gradient-to-br from-orange-300 via-pink-300 to-purple-300 flex items-center justify-center p-4">
                        <div class="w-full max-w-md">
                            <button onclick="app.openNikudSettings()" class="bg-white rounded-2xl px-5 py-3 text-lg font-bold text-blue-700 mb-4">→ החלפת ניקוד או טווח</button>
                            <div class="bg-white rounded-3xl p-8 shadow-2xl text-center slide-in">
                                <h1 class="text-3xl font-bold text-gray-800 mb-2">${nikud.name}</h1>
                                <p class="text-gray-600 text-lg">אות ${this.currentNikudLetterIndex + 1} מתוך ${this.nikudRangeEnd + 1}</p>
                                <div class="text-9xl font-bold text-blue-700 leading-relaxed my-4" aria-label="${letter.name} עם ${nikud.name}">${letter.letter}${nikud.mark}</div>
                                <p class="text-2xl font-bold text-gray-800 mb-5">${letter.name} + ${nikud.name}</p>
                                <button onclick="app.playSound('${letter.letter}${nikud.mark}')" aria-label="השמע ${letter.name} עם ${nikud.name}" class="bg-blue-500 text-white text-xl font-bold rounded-2xl px-6 py-4 mb-7 hover:bg-blue-600">🔊 השמע את הצירוף</button>
                                <div class="flex gap-3">
                                    <button onclick="app.moveNikudLetter(-1)" ${this.currentNikudLetterIndex === 0 ? 'disabled' : ''} class="flex-1 bg-gray-200 text-gray-900 text-xl font-bold py-4 rounded-2xl disabled:opacity-50">הקודמת</button>
                                    <button onclick="app.moveNikudLetter(1)" class="flex-1 bg-orange-500 text-white text-xl font-bold py-4 rounded-2xl">${this.currentNikudLetterIndex === this.nikudRangeEnd ? 'סיום 🎉' : 'הבאה'}</button>
                                </div>
                            </div>
                        </div>
                    </main>
                `;
            }

            renderNikudComplete() {
                const nikud = this.NIKUD_MARKS[this.selectedNikudIndex];
                return `
                    <main class="min-h-screen bg-gradient-to-br from-orange-300 via-pink-300 to-purple-300 flex items-center justify-center p-4">
                        <div class="w-full max-w-md bg-white rounded-3xl p-8 shadow-2xl text-center">
                            <p class="text-7xl mb-4">🎉</p>
                            <h1 class="text-3xl font-bold text-gray-800 mb-3">כל הכבוד!</h1>
                            <p class="text-xl text-gray-700 mb-6">תרגלת ${nikud.name} עם ${this.nikudRangeEnd + 1} אותיות.</p>
                            <button onclick="app.openNikudSettings()" class="w-full bg-orange-500 text-white text-xl font-bold py-4 rounded-2xl mb-3">לומדים ניקוד נוסף</button>
                            <button onclick="app.goToMenu()" class="w-full bg-blue-100 text-blue-800 text-xl font-bold py-4 rounded-2xl">חזרה למשחקים</button>
                        </div>
                    </main>
                `;
            }

            getColorBg(colorClass) {
                const colors = {
                    'kids-pink': '#FF6B9D',
                    'kids-blue': '#4A90E2',
                    'kids-yellow': '#FFD93D',
                    'kids-green': '#6BCB77',
                    'kids-purple': '#9D84B7',
                    'kids-orange': '#FF8C42',
                };
                return colors[colorClass] || '#FF6B9D';
            }

            getColorBgLight(colorClass) {
                const colors = {
                    'kids-pink': '#FFB3D9',
                    'kids-blue': '#B3D9FF',
                    'kids-yellow': '#FFFFB3',
                    'kids-green': '#B3FFB3',
                    'kids-purple': '#D9B3FF',
                    'kids-orange': '#FFD9B3',
                };
                return colors[colorClass] || '#FFB3D9';
            }

            renderMatch() {
                const currentItem = this.currentGameSequence[this.currentGameIndex];
                const buttons = this.currentMatchOptions.map((letter) => {
                    const letterData = this.LETTERS.find(l => l.letter === letter);
                    return `
                        <button onclick="app.handleMatch('${letter}')" ${this.matchLocked ? 'disabled' : ''} aria-label="האות ${letter}" style="background: ${this.getColorBgLight(letterData.color)}; border: 4px solid ${this.getColorBg(letterData.color)};" class="text-6xl font-bold py-4 rounded-2xl hover:scale-105 transition-transform disabled:opacity-60">${letter}</button>
                    `;
                }).join('');

                return `
                    <div class="min-h-screen bg-gradient-to-br from-yellow-300 via-orange-300 to-pink-300 flex items-center justify-center p-4">
                        <div class="w-full max-w-md">
                            <div class="text-center mb-3">
                                <button onclick="app.goToMenu()" aria-label="חזרה למשחקים" class="text-3xl bg-white rounded-full w-12 h-12 flex items-center justify-center hover:bg-gray-200 transition mb-2">✕</button>
                            </div>

                            <div class="bg-white rounded-2xl p-6 shadow-xl">
                                <p class="text-center text-lg text-gray-600 mb-2">מילה ${this.currentGameIndex + 1} מתוך ${this.gameState.total}</p>
                                <h1 class="text-center text-2xl font-bold text-gray-800 mb-4">באיזו אות מתחילה המילה שבתמונה?</h1>
                                <div class="text-center mb-5">
                                    <img src="images/match/${currentItem.image}.webp" alt="${currentItem.word}" width="500" height="333" class="w-full h-48 sm:h-56 object-contain rounded-2xl bg-gray-50 mb-3" loading="eager">
                                    <button onclick="app.playSound('${currentItem.word}')" aria-label="השמע את המילה שבתמונה" class="bg-blue-100 hover:bg-blue-200 border-2 border-blue-500 rounded-2xl px-5 py-2 text-lg font-bold transition">🔊 השמע את המילה</button>
                                </div>

                                <div class="grid grid-cols-3 gap-3">
                                    ${buttons}
                                </div>

                                ${this.messageEmoji ? `<p role="status" class="text-center text-2xl mt-4 font-bold bounce-scale">${this.messageEmoji}</p>` : ''}
                            </div>
                            <p class="text-center mt-3"><a href="image-credits.html" class="text-blue-900 underline">מקורות התמונות</a></p>
                        </div>
                    </div>
                `;
            }

            handleMatch(letter) {
                if (this.mode !== 'match' || this.matchLocked) return;
                const correctLetter = this.currentGameSequence[this.currentGameIndex].letter;
                const round = this.currentGameIndex;
                const runId = this.matchRunId;

                if (letter === correctLetter) {
                    this.matchLocked = true;
                    this.gameState.matches++;
                    this.earnedPoints += 10;
                    this.messageEmoji = 'נכון! ✨';
                    this.render();
                    setTimeout(() => {
                        if (this.mode !== 'match' || this.currentGameIndex !== round || this.matchRunId !== runId) return;
                        this.messageEmoji = '';
                        if (this.gameState.matches < this.gameState.total) {
                            this.currentGameIndex++;
                            this.matchLocked = false;
                            this.prepareMatchOptions();
                            this.render();
                        } else {
                            // Game complete - award points and show celebration
                            this.addScore(this.earnedPoints);
                            this.mode = 'matchComplete';
                            this.render();
                        }
                    }, 1000);
                } else {
                    this.matchLocked = true;
                    this.messageEmoji = 'נסה שוב 🔄';
                    this.render();
                    setTimeout(() => {
                        if (this.mode !== 'match' || this.currentGameIndex !== round || this.matchRunId !== runId) return;
                        this.matchLocked = false;
                        this.messageEmoji = '';
                        this.render();
                    }, 800);
                }
            }

            renderDraw() {
                const letter = this.LETTERS[this.currentLetterIndex];

                return `
                    <div class="min-h-screen bg-gradient-to-br from-red-300 via-pink-300 to-purple-300 flex items-center justify-center p-4">
                        <div class="w-full max-w-md">
                            <div class="text-center mb-4">
                                <button onclick="app.goToMenu()" class="text-3xl bg-white rounded-full w-12 h-12 flex items-center justify-center hover:bg-gray-200 transition">✕</button>
                            </div>

                            <div class="bg-white rounded-2xl p-6 shadow-2xl">
                                <h2 class="text-3xl font-bold text-center text-gray-800 mb-4">✏️ צייר את האות:</h2>
                                <p class="text-4xl font-bold text-center text-blue-500 mb-6">${letter.letter}</p>
                                <p class="text-lg text-center text-gray-600 mb-4">${letter.name}</p>

                                <canvas id="drawCanvas" width="280" height="280" class="border-4 border-blue-500 rounded-xl w-full bg-gray-50 mb-4"></canvas>

                                <div class="flex gap-3">
                                    <button onclick="app.clearCanvas()" class="flex-1 bg-red-400 text-white text-lg font-bold py-3 rounded-xl hover:scale-105 transition">🗑️ מחק</button>
                                    <button onclick="app.nextLetter()" class="flex-1 bg-green-500 text-white text-lg font-bold py-3 rounded-xl hover:scale-105 transition">➜ הבא</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderMatchComplete() {
                return `
                    <div class="min-h-screen bg-gradient-to-br from-purple-400 via-pink-400 to-yellow-400 flex items-center justify-center p-4">
                        <div class="w-full max-w-md">
                            <div class="bg-white rounded-3xl p-8 shadow-2xl text-center slide-in">
                                <p class="text-9xl mb-4 animate-bounce">🎉</p>
                                <h1 class="text-4xl font-bold text-gray-800 mb-2">כל הכבוד!</h1>
                                <p class="text-2xl text-gray-700 mb-6">סיימת את המשחק בהצלחה!</p>

                                <div class="bg-gradient-to-r from-yellow-300 to-orange-300 rounded-2xl p-6 mb-6">
                                    <p class="text-lg text-gray-700 mb-2">נקודות שהרווחת:</p>
                                    <p class="text-6xl font-bold text-white">${this.earnedPoints}</p>
                                    <p class="text-sm text-gray-700 mt-2">⭐ ${this.earnedPoints / 10} התאמות נכונות!</p>
                                </div>

                                <div class="bg-blue-100 rounded-2xl p-4 mb-6">
                                    <p class="text-gray-700 text-lg">📊 ניקוד כולל:</p>
                                    <p class="text-4xl font-bold text-blue-600">🏆 ${this.scores.total}</p>
                                </div>

                                <button onclick="app.goToMenu()" class="w-full bg-green-500 text-white text-2xl font-bold py-4 px-8 rounded-2xl hover:scale-105 transition-transform duration-200">🏠 חזור לבית</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            goToMenu() {
                this.mode = 'menu';
                this.render();
            }

            render() {
                const app = document.getElementById('app');
                if (!app) return;

                let html = '';
                if (this.mode === 'menu') {
                    html = this.renderMenu();
                } else if (this.mode === 'learn') {
                    html = this.renderLearn();
                } else if (this.mode === 'nikudSettings') {
                    html = this.renderNikudSettings();
                } else if (this.mode === 'nikudLearn') {
                    html = this.renderNikudLearn();
                } else if (this.mode === 'nikudComplete') {
                    html = this.renderNikudComplete();
                } else if (this.mode === 'match') {
                    html = this.renderMatch();
                } else if (this.mode === 'matchComplete') {
                    html = this.renderMatchComplete();
                } else if (this.mode === 'sort') {
                    html = this.renderSort();
                } else if (this.mode === 'sortComplete') {
                    html = this.renderSortComplete();
                } else if (this.mode === 'memoryLevels') {
                    html = this.renderMemoryLevels();
                } else if (this.mode === 'memory') {
                    html = this.renderMemory();
                } else if (this.mode === 'memoryComplete') {
                    html = this.renderMemoryComplete();
                } else if (this.mode === 'draw') {
                    html = this.renderDraw();
                }

                app.innerHTML = html;

                if (this.mode === 'draw') {
                    setTimeout(() => {
                        this.canvas = document.getElementById('drawCanvas');
                        if (this.canvas) {
                            this.ctx = this.canvas.getContext('2d');

                            // Mouse support
                            this.canvas.addEventListener('mousedown', (e) => this.startDrawing_(e));
                            this.canvas.addEventListener('mousemove', (e) => this.draw_(e));
                            this.canvas.addEventListener('mouseup', () => this.stopDrawing_());
                            this.canvas.addEventListener('mouseleave', () => this.stopDrawing_());

                            // Touch support (tablet / phone)
                            this.canvas.addEventListener('touchstart', (e) => { e.preventDefault(); this.startDrawing_(e); }, { passive: false });
                            this.canvas.addEventListener('touchmove', (e) => { e.preventDefault(); this.draw_(e); }, { passive: false });
                            this.canvas.addEventListener('touchend', (e) => { e.preventDefault(); this.stopDrawing_(); }, { passive: false });
                            this.canvas.addEventListener('touchcancel', () => this.stopDrawing_());
                        }
                    }, 100);
                }
            }

            getCanvasPos_(e) {
                const rect = this.canvas.getBoundingClientRect();
                // Use touch point if available, otherwise mouse
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else if (e.changedTouches && e.changedTouches.length > 0) {
                    clientX = e.changedTouches[0].clientX;
                    clientY = e.changedTouches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                // Scale from CSS pixels to the canvas internal resolution
                const scaleX = this.canvas.width / rect.width;
                const scaleY = this.canvas.height / rect.height;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY,
                };
            }

            startDrawing_(e) {
                if (!this.canvas) return;
                const { x, y } = this.getCanvasPos_(e);

                this.ctx.beginPath();
                this.ctx.moveTo(x, y);
                this.isDrawing = true;
            }

            draw_(e) {
                if (!this.isDrawing) return;
                const { x, y } = this.getCanvasPos_(e);

                this.ctx.lineTo(x, y);
                this.ctx.strokeStyle = '#4A90E2';
                this.ctx.lineWidth = 8;
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
                this.ctx.stroke();
            }

            stopDrawing_() {
                this.isDrawing = false;
            }
        }

        const app = new AlephBetApp();
    </script>
</body>
</html>
