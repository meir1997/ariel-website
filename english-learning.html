<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אנגלית לאריאל - משחקים לפי שמיעה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            direction: rtl;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background:
                radial-gradient(circle at 16% 18%, rgba(255, 216, 102, .75), transparent 22%),
                radial-gradient(circle at 84% 22%, rgba(72, 219, 251, .62), transparent 22%),
                radial-gradient(circle at 22% 86%, rgba(255, 107, 129, .55), transparent 24%),
                linear-gradient(135deg, #43c6ff 0%, #8e7cff 48%, #ff85b3 100%);
            overflow-x: hidden;
        }
        button, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .en { direction: ltr; unicode-bidi: isolate; letter-spacing: 0; }
        .pop { animation: pop .28s ease-out; }
        .bounce { animation: bounce .75s ease-in-out; }
        @keyframes pop { from { transform: scale(.94); opacity: .35; } to { transform: scale(1); opacity: 1; } }
        @keyframes bounce { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-10px) scale(1.06); } }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const WORDS_TEXT = `dog|כלב|🐶|חיות,cat|חתול|🐱|חיות,bird|ציפור|🐦|חיות,fish|דג|🐟|חיות,cow|פרה|🐮|חיות,horse|סוס|🐴|חיות,duck|ברווז|🦆|חיות,sheep|כבשה|🐑|חיות,lion|אריה|🦁|חיות,monkey|קוף|🐵|חיות,mom|אמא|👩|משפחה,dad|אבא|👨|משפחה,baby|תינוק|👶|משפחה,boy|ילד|👦|משפחה,girl|ילדה|👧|משפחה,friend|חבר|🧒|משפחה,grandma|סבתא|👵|משפחה,grandpa|סבא|👴|משפחה,apple|תפוח|🍎|אוכל,banana|בננה|🍌|אוכל,bread|לחם|🍞|אוכל,milk|חלב|🥛|אוכל,water|מים|💧|אוכל,egg|ביצה|🥚|אוכל,cheese|גבינה|🧀|אוכל,rice|אורז|🍚|אוכל,cake|עוגה|🍰|אוכל,juice|מיץ|🧃|אוכל,carrot|גזר|🥕|אוכל,cookie|עוגייה|🍪|אוכל,red|אדום|🔴|צבעים,blue|כחול|🔵|צבעים,green|ירוק|🟢|צבעים,yellow|צהוב|🟡|צבעים,orange|כתום|🟠|צבעים,purple|סגול|🟣|צבעים,pink|ורוד|🌸|צבעים,black|שחור|⚫|צבעים,white|לבן|⚪|צבעים,brown|חום|🟤|צבעים,one|אחת|1️⃣|מספרים,two|שתיים|2️⃣|מספרים,three|שלוש|3️⃣|מספרים,four|ארבע|4️⃣|מספרים,five|חמש|5️⃣|מספרים,six|שש|6️⃣|מספרים,seven|שבע|7️⃣|מספרים,eight|שמונה|8️⃣|מספרים,nine|תשע|9️⃣|מספרים,ten|עשר|🔟|מספרים,head|ראש|🙂|גוף,eye|עין|👁️|גוף,nose|אף|👃|גוף,mouth|פה|👄|גוף,ear|אוזן|👂|גוף,hand|יד|✋|גוף,foot|כף רגל|🦶|גוף,leg|רגל|🦵|גוף,arm|זרוע|💪|גוף,tummy|בטן|🧍|גוף,house|בית|🏠|בית,room|חדר|🛋️|בית,bed|מיטה|🛏️|בית,chair|כיסא|🪑|בית,table|שולחן|🍽️|בית,door|דלת|🚪|בית,window|חלון|🪟|בית,bath|אמבטיה|🛁|בית,lamp|מנורה|💡|בית,cup|כוס|🥤|בית,ball|כדור|⚽|משחקים,doll|בובה|🧸|משחקים,car|מכונית|🚗|משחקים,blocks|קוביות|🧱|משחקים,book|ספר|📘|משחקים,pencil|עיפרון|✏️|משחקים,crayon|צבע|🖍️|משחקים,bag|תיק|🎒|משחקים,bike|אופניים|🚲|משחקים,kite|עפיפון|🪁|משחקים,sun|שמש|☀️|טבע,moon|ירח|🌙|טבע,star|כוכב|⭐|טבע,sky|שמיים|🌤️|טבע,tree|עץ|🌳|טבע,flower|פרח|🌻|טבע,rain|גשם|🌧️|טבע,cloud|ענן|☁️|טבע,beach|ים|🏖️|טבע,snow|שלג|❄️|טבע,jump|לקפוץ|🤸|פעולות,run|לרוץ|🏃|פעולות,sit|לשבת|🧎|פעולות,stand|לעמוד|🧍|פעולות,eat|לאכול|🍽️|פעולות,drink|לשתות|🥤|פעולות,sleep|לישון|😴|פעולות,play|לשחק|🎲|פעולות,happy|שמח|😀|פעולות,sad|עצוב|😢|פעולות`;

        class ArielEnglishApp {
            constructor() {
                this.words = WORDS_TEXT.split(',').map((row, index) => {
                    const [word, hebrew, emoji, category] = row.split('|');
                    return { id: index + 1, word, hebrew, emoji, category };
                });
                this.mode = 'menu';
                this.message = '';
                this.progress = JSON.parse(localStorage.getItem('arielEnglishProgress') || '{"stars":0,"known":[]}');
                this.known = new Set(this.progress.known);
                this.render();
            }

            save() {
                this.progress.known = [...this.known];
                localStorage.setItem('arielEnglishProgress', JSON.stringify(this.progress));
            }

            shuffle(items) { return [...items].sort(() => Math.random() - 0.5); }
            sample(items, count) { return this.shuffle(items).slice(0, count); }

            speak(text, prefix = '') {
                const utterance = new SpeechSynthesisUtterance(prefix + text);
                utterance.lang = 'en-US';
                utterance.rate = 0.72;
                utterance.pitch = 1.12;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            }

            home() { this.mode = 'menu'; this.message = ''; this.render(); }

            addWin(word, points = 10) {
                this.progress.stars += points;
                this.known.add(word.id);
                this.save();
                this.speak(word.word);
            }

            nextRound(game, total, doneMode, startMode) {
                if (game.index < total - 1) {
                    game.index++;
                    game.answered = false;
                    game.lastCorrect = null;
                    this.message = '';
                    this.mode = startMode;
                    this.render();
                    setTimeout(() => this.speak(game.questions[game.index].word, 'Find '), 250);
                } else {
                    this.mode = doneMode;
                    this.render();
                }
            }

            startListenTap() {
                this.listenGame = { questions: this.sample(this.words, 10), index: 0, correct: 0, stars: 0, answered: false, lastCorrect: null };
                this.message = '';
                this.mode = 'listenTap';
                this.render();
                setTimeout(() => this.speak(this.listenGame.questions[0].word, 'Find '), 250);
            }

            listenOptions() {
                const current = this.listenGame.questions[this.listenGame.index];
                return this.shuffle([current, ...this.sample(this.words.filter(word => word.id !== current.id), 3)]);
            }

            answerListen(id) {
                if (this.listenGame.answered) return;
                const current = this.listenGame.questions[this.listenGame.index];
                const correct = id === current.id;
                this.listenGame.answered = true;
                this.listenGame.lastCorrect = correct;
                if (correct) {
                    this.listenGame.correct++;
                    this.listenGame.stars += 10;
                    this.addWin(current);
                    this.message = 'בדיוק! זה ' + current.hebrew + ' ⭐';
                } else {
                    this.message = 'כמעט. תקשיב שוב וחפש את התמונה';
                    this.speak(current.word, 'Find ');
                }
                this.render();
                setTimeout(() => this.nextRound(this.listenGame, 10, 'listenDone', 'listenTap'), 1150);
            }

            startFeedGame() {
                const friendly = this.words.filter(word => ['אוכל', 'חיות', 'משחקים'].includes(word.category));
                this.feedGame = { questions: this.sample(friendly, 10), index: 0, correct: 0, stars: 0, answered: false, lastCorrect: null };
                this.message = '';
                this.mode = 'feed';
                this.render();
                setTimeout(() => this.speak(this.feedGame.questions[0].word, 'I want '), 250);
            }

            feedOptions() {
                const current = this.feedGame.questions[this.feedGame.index];
                const pool = this.words.filter(word => ['אוכל', 'חיות', 'משחקים'].includes(word.category) && word.id !== current.id);
                return this.shuffle([current, ...this.sample(pool, 5)]);
            }

            answerFeed(id) {
                if (this.feedGame.answered) return;
                const current = this.feedGame.questions[this.feedGame.index];
                const correct = id === current.id;
                this.feedGame.answered = true;
                this.feedGame.lastCorrect = correct;
                if (correct) {
                    this.feedGame.correct++;
                    this.feedGame.stars += 10;
                    this.addWin(current);
                    this.message = 'יאמי! דינו קיבל ' + current.hebrew + ' ⭐';
                } else {
                    this.message = 'דינו מחכה ל-' + current.hebrew;
                    this.speak(current.word, 'I want ');
                }
                this.render();
                setTimeout(() => this.nextRound(this.feedGame, 10, 'feedDone', 'feed'), 1150);
            }

            startSimonGame() {
                const actions = this.words.filter(word => word.category === 'פעולות' || ['hand', 'foot', 'head', 'nose', 'mouth', 'ear'].includes(word.word));
                this.simonGame = { questions: this.sample(actions, 10), index: 0, correct: 0, stars: 0, answered: false, lastCorrect: null };
                this.message = '';
                this.mode = 'simon';
                this.render();
                setTimeout(() => this.speak(this.simonGame.questions[0].word, 'Simon says '), 250);
            }

            simonOptions() {
                const current = this.simonGame.questions[this.simonGame.index];
                const actions = this.words.filter(word => word.category === 'פעולות' || ['hand', 'foot', 'head', 'nose', 'mouth', 'ear'].includes(word.word));
                return this.shuffle([current, ...this.sample(actions.filter(word => word.id !== current.id), 3)]);
            }

            answerSimon(id) {
                if (this.simonGame.answered) return;
                const current = this.simonGame.questions[this.simonGame.index];
                const correct = id === current.id;
                this.simonGame.answered = true;
                this.simonGame.lastCorrect = correct;
                if (correct) {
                    this.simonGame.correct++;
                    this.simonGame.stars += 10;
                    this.addWin(current);
                    this.message = 'מעולה! עושים ' + current.hebrew + ' ⭐';
                } else {
                    this.message = 'נקשיב שוב וננסה';
                    this.speak(current.word, 'Simon says ');
                }
                this.render();
                setTimeout(() => this.nextRound(this.simonGame, 10, 'simonDone', 'simon'), 1150);
            }

            startPictureMemory() {
                const chosen = this.sample(this.words, 6);
                this.memoryGame = {
                    cards: this.shuffle(chosen.flatMap(word => [{ wordId: word.id, open: false, done: false }, { wordId: word.id, open: false, done: false }])),
                    first: null, locked: false, moves: 0, pairs: 0, stars: 0,
                };
                this.message = '';
                this.mode = 'pictureMemory';
                this.render();
            }

            tapMemory(index) {
                if (this.memoryGame.locked) return;
                const card = this.memoryGame.cards[index];
                if (!card || card.open || card.done) return;
                const word = this.words.find(item => item.id === card.wordId);
                card.open = true;
                this.speak(word.word);
                if (this.memoryGame.first === null) {
                    this.memoryGame.first = index;
                    this.render();
                    return;
                }
                const first = this.memoryGame.cards[this.memoryGame.first];
                this.memoryGame.moves++;
                this.memoryGame.locked = true;
                if (first.wordId === card.wordId) {
                    this.memoryGame.pairs++;
                    this.memoryGame.stars += 10;
                    this.progress.stars += 10;
                    this.known.add(word.id);
                    this.save();
                    this.message = 'מצאנו זוג! ' + word.hebrew + ' ⭐';
                    setTimeout(() => {
                        first.done = true;
                        card.done = true;
                        this.memoryGame.first = null;
                        this.memoryGame.locked = false;
                        this.message = '';
                        if (this.memoryGame.pairs === 6) this.mode = 'memoryDone';
                        this.render();
                    }, 850);
                } else {
                    this.message = 'לא אותו דבר. ננסה שוב';
                    setTimeout(() => {
                        first.open = false;
                        card.open = false;
                        this.memoryGame.first = null;
                        this.memoryGame.locked = false;
                        this.message = '';
                        this.render();
                    }, 850);
                }
                this.render();
            }

            renderShell(content) { return `<main class="min-h-screen p-4 sm:p-6"><div class="mx-auto max-w-5xl">${content}</div></main>`; }

            renderTop(title) {
                return `<div class="flex items-center justify-between gap-3 mb-4"><button onclick="app.home()" class="bg-white w-14 h-14 rounded-full shadow text-3xl font-black text-gray-800" aria-label="חזרה">×</button><h1 class="text-white text-2xl sm:text-4xl font-black text-center drop-shadow">${title}</h1><div class="bg-white/90 rounded-2xl px-4 py-2 text-center shadow"><p class="text-xs text-gray-600">כוכבים</p><p class="text-2xl font-black text-amber-500">⭐ ${this.progress.stars}</p></div></div>`;
            }

            renderMenu() {
                return this.renderShell(`<section class="min-h-[calc(100vh-2rem)] flex items-center justify-center"><div class="w-full max-w-md text-center"><div class="text-white mb-5 pop"><p class="text-6xl mb-2">🎧</p><h1 class="text-4xl sm:text-5xl font-black mb-2">אנגלית לאריאל</h1><p class="text-xl sm:text-2xl font-bold">משחקים לפי שמיעה ותמונות</p><div class="mt-4 bg-white/25 rounded-2xl p-3 text-lg"><p>לא צריך לקרוא. שומעים, נוגעים, משחקים.</p><p>מילים מוכרות: <b class="text-yellow-200">${this.known.size}</b> / 100</p></div></div><div class="space-y-3"><button onclick="app.startListenTap()" class="w-full bg-sky-500 text-white text-2xl font-black py-5 rounded-3xl shadow-lg hover:scale-105 transition">🎧 שמע ובחר תמונה</button><button onclick="app.startFeedGame()" class="w-full bg-emerald-500 text-white text-2xl font-black py-5 rounded-3xl shadow-lg hover:scale-105 transition">🦕 האכל את דינו</button><button onclick="app.startSimonGame()" class="w-full bg-orange-500 text-white text-2xl font-black py-5 rounded-3xl shadow-lg hover:scale-105 transition">🏃 סיימון אומר</button><button onclick="app.startPictureMemory()" class="w-full bg-violet-500 text-white text-2xl font-black py-5 rounded-3xl shadow-lg hover:scale-105 transition">🧠 זוגות תמונות</button><button onclick="app.mode='album'; app.render()" class="w-full bg-pink-500 text-white text-2xl font-black py-5 rounded-3xl shadow-lg hover:scale-105 transition">🏅 אלבום מדבקות</button><button onclick="location.href='aleph-bet-learning.html'" class="w-full bg-white text-gray-800 text-xl font-black py-4 rounded-3xl shadow-lg hover:scale-105 transition">↩ אלף בית</button></div></div></section>`);
            }

            pictureButton(word, handler) {
                return `<button onclick="${handler}(${word.id})" class="bg-white rounded-3xl min-h-32 sm:min-h-40 shadow-xl border-4 border-transparent hover:border-yellow-300 hover:scale-105 transition flex flex-col items-center justify-center p-3"><span class="text-6xl sm:text-7xl">${word.emoji}</span><span class="text-base sm:text-lg font-bold text-gray-500 mt-2">${word.hebrew}</span></button>`;
            }

            renderListenTap() {
                const current = this.listenGame.questions[this.listenGame.index];
                return this.renderShell(`${this.renderTop('שמע ובחר תמונה')}<section class="bg-white/95 rounded-3xl p-5 sm:p-8 shadow-2xl text-center pop"><p class="text-lg font-bold text-gray-500">סיבוב ${this.listenGame.index + 1} מתוך 10</p><button onclick="app.speak('${current.word}', 'Find ')" class="my-5 bg-sky-500 text-white text-6xl w-32 h-32 rounded-full shadow-xl hover:scale-105 transition">🔊</button><p class="text-2xl font-black text-gray-800 mb-5">שומעים באנגלית ונוגעים בתמונה</p><div class="grid grid-cols-2 gap-3 sm:gap-4 max-w-2xl mx-auto">${this.listenOptions().map(word => this.pictureButton(word, 'app.answerListen')).join('')}</div>${this.message ? `<p class="text-2xl font-black ${this.listenGame.lastCorrect ? 'text-emerald-600' : 'text-orange-600'} mt-5">${this.message}</p>` : ''}</section>`);
            }

            renderFeed() {
                const current = this.feedGame.questions[this.feedGame.index];
                return this.renderShell(`${this.renderTop('האכל את דינו')}<section class="bg-white/95 rounded-3xl p-5 sm:p-8 shadow-2xl text-center pop"><p class="text-lg font-bold text-gray-500">מנה ${this.feedGame.index + 1} מתוך 10</p><div class="bg-lime-100 rounded-3xl p-5 mb-5"><p class="text-8xl bounce">🦕</p><button onclick="app.speak('${current.word}', 'I want ')" class="bg-emerald-500 text-white text-2xl font-black py-4 px-8 rounded-3xl shadow-lg">🔊 דינו אומר מה הוא רוצה</button></div><div class="grid grid-cols-2 sm:grid-cols-3 gap-3 max-w-2xl mx-auto">${this.feedOptions().map(word => this.pictureButton(word, 'app.answerFeed')).join('')}</div>${this.message ? `<p class="text-2xl font-black ${this.feedGame.lastCorrect ? 'text-emerald-600' : 'text-orange-600'} mt-5">${this.message}</p>` : ''}</section>`);
            }

            renderSimon() {
                const current = this.simonGame.questions[this.simonGame.index];
                return this.renderShell(`${this.renderTop('סיימון אומר')}<section class="bg-white/95 rounded-3xl p-5 sm:p-8 shadow-2xl text-center pop"><p class="text-lg font-bold text-gray-500">תנועה ${this.simonGame.index + 1} מתוך 10</p><button onclick="app.speak('${current.word}', 'Simon says ')" class="my-5 bg-orange-500 text-white text-6xl w-32 h-32 rounded-full shadow-xl hover:scale-105 transition">🔊</button><p class="text-2xl font-black text-gray-800 mb-2">שומעים, עושים עם הגוף, ואז נוגעים בתמונה</p><div class="grid grid-cols-2 gap-3 max-w-xl mx-auto">${this.simonOptions().map(word => this.pictureButton(word, 'app.answerSimon')).join('')}</div>${this.message ? `<p class="text-2xl font-black ${this.simonGame.lastCorrect ? 'text-emerald-600' : 'text-orange-600'} mt-5">${this.message}</p>` : ''}</section>`);
            }

            renderMemory() {
                const cards = this.memoryGame.cards.map((card, index) => {
                    const word = this.words.find(item => item.id === card.wordId);
                    const open = card.open || card.done;
                    return `<button onclick="app.tapMemory(${index})" class="${card.done ? 'bg-emerald-100 border-emerald-400' : open ? 'bg-white border-amber-300' : 'bg-violet-500 border-violet-700'} border-4 rounded-2xl min-h-24 sm:min-h-32 shadow-lg flex items-center justify-center text-center p-2 hover:scale-105 transition">${open ? `<span><span class="block text-5xl sm:text-6xl">${word.emoji}</span><span class="block text-sm font-bold text-gray-600">${word.hebrew}</span></span>` : '<span class="text-4xl text-white">?</span>'}</button>`;
                }).join('');
                return this.renderShell(`${this.renderTop('זוגות תמונות')}<section class="bg-white/95 rounded-3xl p-4 sm:p-6 shadow-2xl"><div class="text-center mb-4"><p class="text-lg font-bold text-gray-600">פותחים תמונות. בכל פתיחה שומעים את המילה באנגלית.</p><p class="text-sm font-bold text-gray-500">זוגות: ${this.memoryGame.pairs} / 6 · מהלכים: ${this.memoryGame.moves}</p></div><div class="grid grid-cols-3 sm:grid-cols-4 gap-2 sm:gap-3">${cards}</div>${this.message ? `<p class="text-center text-2xl font-black text-emerald-600 mt-5">${this.message}</p>` : ''}</section>`);
            }

            renderAlbum() {
                const known = this.words.filter(word => this.known.has(word.id));
                const stickers = known.length ? known.map(word => `<button onclick="app.speak('${word.word}')" class="bg-white rounded-2xl p-3 shadow text-center"><span class="block text-5xl">${word.emoji}</span><span class="block text-sm font-bold text-gray-500">${word.hebrew}</span></button>`).join('') : '<div class="bg-white/90 rounded-3xl p-8 text-center text-xl font-bold text-gray-700">עוד מעט יופיעו כאן מדבקות ⭐</div>';
                return this.renderShell(`${this.renderTop('אלבום מדבקות')}<section class="grid grid-cols-3 sm:grid-cols-5 gap-3">${stickers}</section>`);
            }

            renderDone(title, correct, total, stars, restartCall) {
                return this.renderShell(`<section class="min-h-[calc(100vh-2rem)] flex items-center justify-center"><div class="bg-white rounded-3xl p-8 shadow-2xl text-center max-w-md w-full pop"><p class="text-8xl mb-3">🎉</p><h1 class="text-4xl font-black text-gray-900 mb-2">${title}</h1><p class="text-2xl text-gray-700 mb-5">הצלחת ${correct} מתוך ${total}</p><div class="bg-amber-100 rounded-3xl p-5 text-5xl font-black text-amber-500 mb-5">⭐ ${stars}</div><button onclick="${restartCall}" class="w-full bg-emerald-500 text-white text-xl font-black py-4 rounded-2xl mb-3">עוד פעם</button><button onclick="app.home()" class="w-full bg-sky-500 text-white text-xl font-black py-4 rounded-2xl">חזרה לבית</button></div></section>`);
            }

            render() {
                const views = {
                    menu: () => this.renderMenu(),
                    listenTap: () => this.renderListenTap(),
                    listenDone: () => this.renderDone('הקשבת מצוין!', this.listenGame.correct, 10, this.listenGame.stars, 'app.startListenTap()'),
                    feed: () => this.renderFeed(),
                    feedDone: () => this.renderDone('דינו שבע ושמח!', this.feedGame.correct, 10, this.feedGame.stars, 'app.startFeedGame()'),
                    simon: () => this.renderSimon(),
                    simonDone: () => this.renderDone('סיימון מרוצה!', this.simonGame.correct, 10, this.simonGame.stars, 'app.startSimonGame()'),
                    pictureMemory: () => this.renderMemory(),
                    memoryDone: () => this.renderDone('כל הזוגות נמצאו!', this.memoryGame.pairs, 6, this.memoryGame.stars, 'app.startPictureMemory()'),
                    album: () => this.renderAlbum(),
                };
                document.getElementById('app').innerHTML = views[this.mode]();
            }
        }

        window.app = new ArielEnglishApp();
    </script>
</body>
</html>
