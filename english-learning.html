<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אנגלית בכיף - 100 מילים ראשונות</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:'Segoe UI',Tahoma,sans-serif;direction:rtl;background:linear-gradient(135deg,#5bd7ff,#9f7aea 48%,#ff8fb3);overflow-x:hidden} button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}.en{direction:ltr;unicode-bidi:isolate;letter-spacing:0}.pop{animation:pop .28s ease-out}@keyframes pop{from{transform:scale(.95);opacity:.4}to{transform:scale(1);opacity:1}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const DATA = `dog|כלב|🐶|חיות,cat|חתול|🐱|חיות,bird|ציפור|🐦|חיות,fish|דג|🐟|חיות,cow|פרה|🐮|חיות,horse|סוס|🐴|חיות,duck|ברווז|🦆|חיות,sheep|כבשה|🐑|חיות,lion|אריה|🦁|חיות,monkey|קוף|🐵|חיות,mom|אמא|👩|משפחה,dad|אבא|👨|משפחה,baby|תינוק|👶|משפחה,boy|ילד|👦|משפחה,girl|ילדה|👧|משפחה,friend|חבר|🧒|משפחה,grandma|סבתא|👵|משפחה,grandpa|סבא|👴|משפחה,apple|תפוח|🍎|אוכל,banana|בננה|🍌|אוכל,bread|לחם|🍞|אוכל,milk|חלב|🥛|אוכל,water|מים|💧|אוכל,egg|ביצה|🥚|אוכל,cheese|גבינה|🧀|אוכל,rice|אורז|🍚|אוכל,cake|עוגה|🍰|אוכל,juice|מיץ|🧃|אוכל,carrot|גזר|🥕|אוכל,cookie|עוגייה|🍪|אוכל,red|אדום|🔴|צבעים,blue|כחול|🔵|צבעים,green|ירוק|🟢|צבעים,yellow|צהוב|🟡|צבעים,orange|כתום|🟠|צבעים,purple|סגול|🟣|צבעים,pink|ורוד|🌸|צבעים,black|שחור|⚫|צבעים,white|לבן|⚪|צבעים,brown|חום|🟤|צבעים,one|אחת|1️⃣|מספרים,two|שתיים|2️⃣|מספרים,three|שלוש|3️⃣|מספרים,four|ארבע|4️⃣|מספרים,five|חמש|5️⃣|מספרים,six|שש|6️⃣|מספרים,seven|שבע|7️⃣|מספרים,eight|שמונה|8️⃣|מספרים,nine|תשע|9️⃣|מספרים,ten|עשר|🔟|מספרים,head|ראש|🙂|גוף,eye|עין|👁️|גוף,nose|אף|👃|גוף,mouth|פה|👄|גוף,ear|אוזן|👂|גוף,hand|יד|✋|גוף,foot|כף רגל|🦶|גוף,leg|רגל|🦵|גוף,arm|זרוע|💪|גוף,tummy|בטן|🧍|גוף,house|בית|🏠|בית,room|חדר|🛋️|בית,bed|מיטה|🛏️|בית,chair|כיסא|🪑|בית,table|שולחן|🍽️|בית,door|דלת|🚪|בית,window|חלון|🪟|בית,bath|אמבטיה|🛁|בית,lamp|מנורה|💡|בית,cup|כוס|🥤|בית,ball|כדור|⚽|משחקים,doll|בובה|🧸|משחקים,car|מכונית|🚗|משחקים,blocks|קוביות|🧱|משחקים,book|ספר|📘|משחקים,pencil|עיפרון|✏️|משחקים,crayon|צבע|🖍️|משחקים,bag|תיק|🎒|משחקים,bike|אופניים|🚲|משחקים,kite|עפיפון|🪁|משחקים,sun|שמש|☀️|טבע,moon|ירח|🌙|טבע,star|כוכב|⭐|טבע,sky|שמיים|🌤️|טבע,tree|עץ|🌳|טבע,flower|פרח|🌻|טבע,rain|גשם|🌧️|טבע,cloud|ענן|☁️|טבע,beach|ים|🏖️|טבע,snow|שלג|❄️|טבע,jump|לקפוץ|🤸|פעולות,run|לרוץ|🏃|פעולות,sit|לשבת|🧎|פעולות,stand|לעמוד|🧍|פעולות,eat|לאכול|🍽️|פעולות,drink|לשתות|🥤|פעולות,sleep|לישון|😴|פעולות,play|לשחק|🎲|פעולות,happy|שמח|😀|פעולות,sad|עצוב|😢|פעולות`;
    class App{
      constructor(){this.words=DATA.split(',').map((r,i)=>{const [word,hebrew,emoji,cat]=r.split('|');return{id:i+1,word,hebrew,emoji,cat}});this.mode='menu';this.i=0;this.cat='הכל';this.quiz=null;this.msg='';this.progress=JSON.parse(localStorage.englishWords||'{"stars":0,"known":[]}');this.known=new Set(this.progress.known);this.render()}
      save(){this.progress.known=[...this.known];localStorage.englishWords=JSON.stringify(this.progress)}
      cats(){return ['הכל',...[...new Set(this.words.map(w=>w.cat))]]}
      list(){return this.cat==='הכל'?this.words:this.words.filter(w=>w.cat===this.cat)}
      speak(t){const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.72;u.pitch=1.15;speechSynthesis.cancel();speechSynthesis.speak(u)}
      pick(a,n){return [...a].sort(()=>Math.random()-.5).slice(0,n)}
      shell(x){return `<main class="min-h-screen p-4 sm:p-6"><div class="mx-auto max-w-5xl">${x}</div></main>`}
      top(t){return `<div class="flex items-center justify-between gap-3 mb-4"><button onclick="app.home()" class="bg-white w-14 h-14 rounded-full shadow text-3xl font-black">×</button><h1 class="text-white text-2xl sm:text-4xl font-black text-center drop-shadow">${t}</h1><div class="bg-white/90 rounded-2xl px-4 py-2 text-center shadow"><p class="text-xs text-gray-600">כוכבים</p><p class="text-2xl font-black text-amber-500">⭐ ${this.progress.stars}</p></div></div>`}
      home(){this.mode='menu';this.msg='';this.render()}
      learn(c='הכל'){this.cat=c;this.i=0;this.mode='learn';this.msg='';this.render()}
      mark(id){if(!this.known.has(id)){this.known.add(id);this.progress.stars+=5;this.save();this.msg='עוד מילה נכנסה לאוצר המילים ⭐'}else this.msg='המילה הזו כבר ידועה ✅';this.render()}
      quizStart(type){this.quiz={type,qs:this.pick(this.words,10),i:0,ok:0,stars:0,done:false};this.mode='quiz';this.msg='';this.render();if(type==='listen')setTimeout(()=>this.speak(this.q().word),250)}
      q(){return this.quiz.qs[this.quiz.i]}
      answer(id){if(this.quiz.done)return;const q=this.q(),ok=id===q.id;this.quiz.done=true;if(ok){this.quiz.ok++;this.quiz.stars+=10;this.progress.stars+=10;this.known.add(q.id);this.save();this.msg='נכון! '+q.word+' ⭐'}else this.msg='כמעט. זו המילה '+q.word;this.speak(q.word);this.render();setTimeout(()=>{if(this.quiz.i<9){this.quiz.i++;this.quiz.done=false;this.msg='';this.render();if(this.quiz.type==='listen')this.speak(this.q().word)}else{this.mode='done';this.render()}},1200)}
      renderMenu(){return this.shell(`<section class="min-h-[calc(100vh-2rem)] flex items-center justify-center"><div class="w-full max-w-md text-center"><div class="text-white mb-5 pop"><p class="text-6xl mb-2">🌈</p><h1 class="text-4xl sm:text-5xl font-black mb-2">אנגלית בכיף</h1><p class="text-xl sm:text-2xl font-bold">100 מילים ראשונות לילד בן 5</p><p class="mt-4 bg-white/25 rounded-2xl p-3 text-lg">למדנו <b class="text-yellow-200">${this.known.size}</b> מתוך <b class="text-yellow-200">100</b> מילים</p></div><div class="space-y-3"><button onclick="app.learn()" class="w-full bg-rose-500 text-white text-2xl font-black py-5 rounded-3xl shadow-lg">🔊 מסע מילים</button><button onclick="app.quizStart('picture')" class="w-full bg-sky-500 text-white text-2xl font-black py-5 rounded-3xl shadow-lg">🖼️ מצא את המילה</button><button onclick="app.quizStart('listen')" class="w-full bg-emerald-500 text-white text-2xl font-black py-5 rounded-3xl shadow-lg">👂 משחק שמיעה</button><button onclick="app.mode='all';app.render()" class="w-full bg-violet-500 text-white text-2xl font-black py-5 rounded-3xl shadow-lg">📚 כל 100 המילים</button><button onclick="location.href='aleph-bet-learning.html'" class="w-full bg-white text-gray-800 text-xl font-black py-4 rounded-3xl shadow-lg">↩ אלף בית</button></div></div></section>`)}
      renderLearn(){const words=this.list(),w=words[this.i],tabs=this.cats().map(c=>`<button onclick="app.learn('${c}')" class="${c===this.cat?'bg-gray-900 text-white':'bg-white text-gray-700'} px-4 py-2 rounded-full shadow font-bold whitespace-nowrap">${c}</button>`).join('');return this.shell(`${this.top('מסע מילים')}<div class="flex gap-2 overflow-x-auto pb-3 mb-3">${tabs}</div><section class="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 text-center pop"><p class="font-bold text-gray-500 mb-2">${w.cat} · מילה ${this.i+1} מתוך ${words.length}</p><button onclick="app.speak('${w.word}')" class="text-8xl sm:text-9xl mb-3">${w.emoji}</button><p class="en text-5xl sm:text-7xl font-black text-gray-900">${w.word}</p><p class="text-3xl sm:text-4xl font-bold text-gray-600 mb-5">${w.hebrew}</p><div class="flex flex-col sm:flex-row gap-3 justify-center mb-4"><button onclick="app.speak('${w.word}')" class="bg-sky-500 text-white text-xl font-black py-4 px-8 rounded-2xl">🔊 שמע שוב</button><button onclick="app.mark(${w.id})" class="bg-amber-400 text-white text-xl font-black py-4 px-8 rounded-2xl">⭐ אני יודע</button></div>${this.msg?`<p class="text-xl font-bold text-emerald-600 mb-4">${this.msg}</p>`:''}<div class="flex gap-3"><button onclick="app.i=(app.i-1+app.list().length)%app.list().length;app.msg='';app.render()" class="flex-1 bg-gray-100 text-3xl font-black py-4 rounded-2xl">→</button><button onclick="app.i=(app.i+1)%app.list().length;app.msg='';app.render()" class="flex-1 bg-gray-100 text-3xl font-black py-4 rounded-2xl">←</button></div></section>`)}
      renderQuiz(){const q=this.q(),listen=this.quiz.type==='listen',opts=this.pick(this.words.filter(w=>w.id!==q.id),3).concat(q).sort(()=>Math.random()-.5);return this.shell(`${this.top(listen?'משחק שמיעה':'מצא את המילה')}<section class="bg-white/95 rounded-3xl p-5 sm:p-8 shadow-2xl"><p class="text-center text-lg font-bold text-gray-500 mb-4">שאלה ${this.quiz.i+1} מתוך 10</p><div class="text-center mb-5">${listen?`<button onclick="app.speak('${q.word}')" class="bg-emerald-500 text-white text-5xl w-28 h-28 rounded-full shadow-xl">🔊</button><p class="text-2xl font-black mt-4">מה שמעת?</p>`:`<p class="text-8xl sm:text-9xl">${q.emoji}</p><p class="text-2xl font-black">איך אומרים ${q.hebrew} באנגלית?</p>`}</div><div class="grid grid-cols-2 gap-3">${opts.map(o=>`<button onclick="app.answer(${o.id})" class="bg-white rounded-3xl p-4 min-h-32 shadow-xl flex flex-col items-center justify-center border-4 border-transparent"><span class="${listen?'':'en'} block text-3xl font-black">${listen?o.emoji:o.word}</span><span class="block text-lg font-bold text-gray-600">${o.hebrew}</span></button>`).join('')}</div>${this.msg?`<p class="text-center text-2xl font-black text-emerald-600 mt-5">${this.msg}</p>`:''}</section>`)}
      renderDone(){return this.shell(`<section class="min-h-[calc(100vh-2rem)] flex items-center justify-center"><div class="bg-white rounded-3xl p-8 shadow-2xl text-center max-w-md w-full"><p class="text-8xl">🎉</p><h1 class="text-4xl font-black mb-2">כל הכבוד!</h1><p class="text-2xl text-gray-700 mb-5">ענית נכון על ${this.quiz.ok} מתוך 10</p><p class="bg-amber-100 rounded-3xl p-5 text-5xl font-black text-amber-500 mb-5">⭐ ${this.quiz.stars}</p><button onclick="app.quizStart(app.quiz.type)" class="w-full bg-emerald-500 text-white text-xl font-black py-4 rounded-2xl mb-3">עוד פעם</button><button onclick="app.home()" class="w-full bg-sky-500 text-white text-xl font-black py-4 rounded-2xl">חזרה לבית</button></div></section>`)}
      renderAll(){const groups=this.cats().filter(c=>c!=='הכל').map(c=>`<section class="mb-5"><h2 class="text-2xl font-black text-white mb-3 drop-shadow">${c}</h2><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">${this.words.filter(w=>w.cat===c).map(w=>`<button onclick="app.speak('${w.word}')" class="bg-white rounded-2xl p-3 shadow flex items-center gap-3 text-right"><span class="text-4xl">${w.emoji}</span><span class="flex-1"><span class="en block text-2xl font-black">${w.word}</span><span class="block font-bold text-gray-600">${w.hebrew}</span></span><span>🔊</span></button>`).join('')}</div></section>`).join('');return this.shell(`${this.top('כל 100 המילים')}${groups}`)}
      render(){document.getElementById('app').innerHTML=this.mode==='menu'?this.renderMenu():this.mode==='learn'?this.renderLearn():this.mode==='quiz'?this.renderQuiz():this.mode==='done'?this.renderDone():this.renderAll()}
    }
    window.app = new App();
  </script>
</body>
</html>
